<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Flipkart Clone</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Navbar -->
    <header class="navbar">
        <div class="logo">Flipkart</div>
        <input type="text" placeholder="Search for products..." class="search-box">
        <button class="login-btn">Login</button>
        <div class="cart">Cart 🛒</div>
    </header>

    <!-- Categories -->
    <section class="categories">
        <div>Mobiles</div>
        <div>Fashion</div>
        <div>Electronics</div>
        <div>Home</div>
        <div>Appliances</div>
    </section>

    <!-- Banner -->
    <section class="banner">
        <h2>Big Billion Days Sale</h2>
    </section>

    <!-- Products -->
    <section class="products">
        <div class="card">
            <img src="https://via.placeholder.com/150">
            <h3>iPhone</h3>
            <p>₹70,000</p>
        </div>

        <div class="card">
            <img src="https://via.placeholder.com/150">
            <h3>Shoes</h3>
            <p>₹2,000</p>
        </div>

        <div class="card">
            <img src="https://via.placeholder.com/150">
            <h3>Laptop</h3>
            <p>₹50,000</p>
        </div>

        <div class="card">
            <img src="https://via.placeholder.com/150">
            <h3>Headphones</h3>
            <p>₹1,500</p>
        </div>
    </section>

</body>
</html>
